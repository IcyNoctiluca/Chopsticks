<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1220" />
    <title>Chopsticks — Online</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <h1>Chopsticks Online</h1>
      <p id="status" aria-live="assertive">Connect to a match server to play online.</p>

      <section id="lobby" class="lobby">
        <div class="lobby-row">
          <label for="ruleset">Ruleset</label>
          <select id="ruleset">
            <option value="classic-v1">classic-v1</option>
            <option value="classic-tournament-v1">classic-tournament-v1</option>
          </select>
        </div>
        <div class="lobby-row">
          <button id="btn-create" type="button">Create room</button>
        </div>
        <div class="lobby-row">
          <input id="room-code" type="text" placeholder="Room code" aria-label="Room code" />
          <button id="btn-join" type="button">Join room</button>
        </div>
      </section>

      <section id="game" hidden>
        <div id="room-info" class="room-info">
          <span id="room-code-display"></span>
          <button id="btn-copy-code" type="button">Copy code</button>
        </div>
        <div id="add-ai-control" hidden>
          <button id="btn-add-ai" type="button">Add AI opponent</button>
        </div>
        <section id="board" aria-label="Game board">
          <div id="opponent" class="player-row opponent" data-player="B"></div>
          <div id="player" class="player-row player" data-player="A"></div>
        </section>
        <div id="split-control" hidden></div>
        <nav id="controls">
          <button id="btn-leave" type="button">Leave room</button>
        </nav>
      </section>
    </main>
    <script type="module" src="./online.ts"></script>
  </body>
</html>
